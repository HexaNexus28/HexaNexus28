<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d"><title id="t">Écosystème ShiftStar</title><desc id="d">Schéma : ShiftStar, SkillScan et des modules internes autour d&#x27;un noyau partagé (Postgres, RLS, SSO, journal), une console qui reçoit les erreurs, le tout sur un VPS géré par Ansible.</desc><style>
:root{--bg:#0b0f14;--card:#0f151c;--line:#1f2b39;--fg:#e6edf3;--muted:#7d8da1;--accent:#3ddc97;--warn:#f2b84b}
@media (prefers-color-scheme: light){:root{--bg:#f6f8fa;--card:#ffffff;--line:#d0d7de;--fg:#0d1117;--muted:#57606a;--accent:#0a8f5b;--warn:#9a6700}}
text{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace}
.bg{fill:var(--bg)}.card{fill:var(--card);stroke:var(--line);stroke-width:1}
.t{fill:var(--fg);font-size:22px;font-weight:700}.p{fill:var(--muted);font-size:13px}
.chip{fill:none;stroke:var(--line)}.chipt{fill:var(--muted);font-size:11px}
.ac{fill:var(--accent)}.as{stroke:var(--accent);fill:none}.tag{fill:var(--accent);font-size:11px;letter-spacing:1px}
.lock{fill:var(--warn);font-size:11px;letter-spacing:1px}
.in{opacity:0;animation:up .8s ease-out .2s forwards}.in2{opacity:0;animation:up .8s ease-out .6s forwards}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in,.in2{opacity:1}}
</style><rect class="bg" width="1200" height="440"/><path d="M290 139 H470" class="as" stroke-width="1.2" opacity=".5"/><path d="M730 139 H910" class="as" stroke-width="1.2" opacity=".5"/><path d="M290 229 H470" class="as" stroke-width="1.2" opacity=".5"/><path d="M290 319 H470" class="as" stroke-width="1.2" opacity=".5"/><rect class="card" x="470" y="104" width="260" height="250" rx="16" style="stroke:var(--accent)"/><text class="tag" x="600" y="134" text-anchor="middle">NOYAU PARTAGÉ</text><g class="in2" style="animation-delay:0.4s"><text x="600" y="172" text-anchor="middle" style="fill:var(--fg);font-size:15px;font-weight:700">Postgres</text><text class="p" x="600" y="190" text-anchor="middle" font-size="11">une base, tables par domaine</text></g><g class="in2" style="animation-delay:0.6000000000000001s"><text x="600" y="218" text-anchor="middle" style="fill:var(--fg);font-size:15px;font-weight:700">RLS</text><text class="p" x="600" y="236" text-anchor="middle" font-size="11">isolation par site · RPC visé</text></g><g class="in2" style="animation-delay:0.8s"><text x="600" y="264" text-anchor="middle" style="fill:var(--fg);font-size:15px;font-weight:700">SSO</text><text class="p" x="600" y="282" text-anchor="middle" font-size="11">un compte, toutes les apps</text></g><g class="in2" style="animation-delay:1.0s"><text x="600" y="310" text-anchor="middle" style="fill:var(--fg);font-size:15px;font-weight:700">Journal</text><text class="p" x="600" y="328" text-anchor="middle" font-size="11">faits et erreurs tracés</text></g><g class="in2"><rect class="card" x="60" y="110" width="230" height="58" rx="10"/><rect x="60" y="110" width="4" height="58" rx="2" fill="#F59E0B"/><svg x="74" y="122" width="34" height="34" viewBox="0 0 64 64">
