<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d"><title id="t">Architecture de l'écosystème ShiftStar</title><desc id="d">Les frontends sur Vercel (ShiftStar, SkillScan, console, site) parlent à une couche de données auto-hébergée sur un VPS : Postgres avec RLS, authentification unique, temps réel, fonctions. À droite, la frontière de données : chaque site est un tenant, une organisation regroupe des sites et les franchit par un chemin explicite.</desc><style>
:root{--bg:#0b0f14;--pn:#0f151c;--ln:#26344a;--fg:#e6edf3;--mu:#8a9bb4;--ac:#3ddc97;--wa:#f2b84b}
@media (prefers-color-scheme: light){:root{--bg:#f6f8fa;--pn:#ffffff;--ln:#c4ced9;--fg:#0d1117;--mu:#57606a;--ac:#0a8f5b;--wa:#9a6700}}
text{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace}
.bg{fill:var(--bg)}.pn{fill:var(--pn);stroke:var(--ln);stroke-width:1}
.grp{fill:none;stroke:var(--ln);stroke-width:1.2;stroke-dasharray:5 5}
.tag{fill:var(--ac);font-size:13px;letter-spacing:1px}
.n{fill:var(--fg);font-size:17px;font-weight:700}.s{fill:var(--mu);font-size:13.5px}
.ar{stroke:var(--ln);stroke-width:1.6;fill:none}
.flow{stroke:var(--ac);stroke-width:1.2;fill:none;stroke-dasharray:4 5;opacity:.7}
.in{opacity:0;animation:up .7s ease-out forwards}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in{opacity:1}}
</style><rect class="bg" width="1200" height="400"/><g class="in"><rect class="pn" x="330" y="14" width="240" height="34" rx="17"/><text class="s" x="450" y="36" text-anchor="middle" style="font-size:14px">Navigateur · mobile (PWA)</text></g><path class="ar" d="M450 48 V78"/><rect class="grp" x="40" y="78" width="760" height="124" rx="14"/><text class="tag" x="58" y="98">FRONTENDS · VERCEL</text><g class="in" style="animation-delay:0.10s"><rect class="pn" x="58" y="112" width="170" height="62" rx="10" style="stroke:#F59E0B"/><svg x="70" y="120" width="28" height="28" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#goldGrad)"/>
  <text x="32" y="46" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="38" font-weight="900" fill="white">S</text>
  <circle cx="50" cy="12" r="5" fill="white" opacity="0.9"/>
</svg><text class="n" x="108" y="138">ShiftStar</text><text class="s" x="72" y="161">votes, classements</text></g><g class="in" style="animation-delay:0.22s"><rect class="pn" x="240" y="112" width="170" height="62" rx="10" style="stroke:#f59e0b"/><svg x="252" y="120" width="28" height="28" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#f59e0b"/><polygon points="17,3 4,19 16,19 15,29 28,13 16,13" fill="#09090b"/></svg><text class="n" x="290" y="138">SkillScan</text><text class="s" x="254" y="161">compétences</text></g><g class="in" style="animation-delay:0.34s"><rect class="pn" x="422" y="112" width="170" height="62" rx="10" style="stroke:var(--ln)"/><text class="n" x="436" y="138">Console</text><text class="s" x="436" y="161">administration</text></g><g class="in" style="animation-delay:0.46s"><rect class="pn" x="604" y="112" width="170" height="62" rx="10" style="stroke:var(--ln)"/><text class="n" x="618" y="138">Site + docs</text><text class="s" x="618" y="161">pages publiques</text></g><path class="ar" d="M300 202 V232"/><circle r="3.5" fill="var(--ac)"><animateMotion dur="3.2s" begin="0s" repeatCount="indefinite" path="M300 202 V232"/></circle><path class="ar" d="M560 202 V232"/><circle r="3.5" fill="var(--ac)"><animateMotion dur="3.2s" begin="1.1s" repeatCount="indefinite" path="M560 202 V232"/></circle><rect class="grp" x="40" y="232" width="760" height="150" rx="14"/><text class="tag" x="58" y="252">DONNÉES · VPS AUTO-HÉBERGÉ</text><g class="in" style="animation-delay:0.50s"><rect class="pn" x="58" y="264" width="170" height="62" rx="10" style="stroke:var(--ln)"/><text class="n" x="72" y="290">Postgres + RLS</text><text class="s" x="72" y="313">isolation par site</text></g><g class="in" style="animation-delay:0.62s"><rect class="pn" x="240" y="264" width="170" height="62" rx="10" style="stroke:var(--ln)"/><text class="n" x="254" y="290">Auth + SSO</text><text class="s" x="254" y="313">un seul compte</text></g><g class="in" style="animation-delay:0.74s"><rect class="pn" x="422" y="264" width="170" height="62" rx="10" style="stroke:var(--ln)"/><text class="n" x="436" y="290">Realtime</text><text class="s" x="436" y="313">temps réel</text></g><g class="in" style="animation-delay:0.86s"><rect class="pn" x="604" y="264" width="170" height="62" rx="10" style="stroke:var(--ln)"/><text class="n" x="618" y="290">Edge Functions</text><text class="s" x="618" y="313">e-mails, rappels</text></g><text class="s" x="58" y="364" style="font-size:14px">Ansible · Docker Compose · Cloudflare · héberge aussi EduSocialNews et ORION</text><rect class="pn" x="830" y="14" width="330" height="368" rx="14"/><text class="tag" x="848" y="36">FRONTIÈRE DE DONNÉES</text><rect class="grp" x="850" y="50" width="290" height="208" rx="12" style="stroke:var(--wa)"/><text class="s" x="864" y="70" style="fill:var(--wa);font-size:14px">organisation</text><g class="in" style="animation-delay:0.70s"><rect class="pn" x="862" y="128" width="82" height="96" rx="10" style="stroke:var(--ac);stroke-width:1.6"/><text class="n" x="903" y="170" text-anchor="middle" style="font-size:16px">site A</text><text class="s" x="903" y="192" text-anchor="middle" style="font-size:12px">son tenant</text></g><g class="in" style="animation-delay:0.85s"><rect class="pn" x="958" y="128" width="82" height="96" rx="10" style="stroke:var(--ac);stroke-width:1.6"/><text class="n" x="999" y="170" text-anchor="middle" style="font-size:16px">site B</text><text class="s" x="999" y="192" text-anchor="middle" style="font-size:12px">son tenant</text></g><g class="in" style="animation-delay:1.00s"><rect class="pn" x="1054" y="128" width="82" height="96" rx="10" style="stroke:var(--ac);stroke-width:1.6"/><text class="n" x="1095" y="170" text-anchor="middle" style="font-size:16px">site C</text><text class="s" x="1095" y="192" text-anchor="middle" style="font-size:12px">son tenant</text></g><path class="flow" d="M903 128 C 903 86, 1095 86, 1095 128"/><circle r="4" fill="var(--wa)"><animateMotion dur="4s" repeatCount="indefinite" path="M903 128 C 903 86, 1095 86, 1095 128"/></circle><text class="s" x="1000" y="82" text-anchor="middle" style="fill:var(--wa);font-size:13px">chemin explicite</text><text class="s" x="848" y="292">Un script de conformité</text><text class="s" x="848" y="312">vérifie le modèle avant et</text><text class="s" x="848" y="332">après chaque mise en prod.</text><text class="tag" x="848" y="366">TENANT = SITE</text></svg>