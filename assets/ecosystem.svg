</svg><text x="122" y="135" style="fill:var(--fg);font-size:15px;font-weight:700">ShiftStar</text><text class="p" x="122" y="154" font-size="11">challenges, votes, classements</text></g><g class="in2"><rect class="card" x="60" y="200" width="230" height="58" rx="10"/><rect x="60" y="200" width="4" height="58" rx="2" fill="#f59e0b"/><svg x="74" y="212" width="34" height="34" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#f59e0b"/><polygon points="17,3 4,19 16,19 15,29 28,13 16,13" fill="#09090b"/></svg><text x="122" y="225" style="fill:var(--fg);font-size:15px;font-weight:700">SkillScan</text><text class="p" x="122" y="244" font-size="11">évaluation des compétences</text></g><g class="in2"><rect class="card" x="60" y="290" width="230" height="58" rx="10"/><rect x="60" y="290" width="4" height="58" rx="2" fill="var(--accent)"/><text x="76" y="315" style="fill:var(--fg);font-size:15px;font-weight:700">Modules internes</text><text class="p" x="76" y="334" font-size="11">administration de la plateforme</text></g><g class="in2"><rect class="card" x="910" y="110" width="230" height="58" rx="10"/><rect x="910" y="110" width="4" height="58" rx="2" fill="var(--accent)"/><text x="926" y="135" style="fill:var(--fg);font-size:15px;font-weight:700">Console plateforme</text><text class="p" x="926" y="154" font-size="11">suivi des erreurs et du journal</text></g><path id="err" d="M175 108 C 175 40, 900 40, 1025 108" fill="none" stroke="var(--accent)" stroke-width="1" opacity=".35" stroke-dasharray="3 5"/><circle r="3" fill="var(--accent)"><animateMotion dur="6s" begin="0.00s" repeatCount="indefinite" path="M175 108 C 175 40, 900 40, 1025 108"/></circle><circle r="3" fill="var(--accent)"><animateMotion dur="6s" begin="1.50s" repeatCount="indefinite" path="M175 108 C 175 40, 900 40, 1025 108"/></circle><circle r="3" fill="var(--accent)"><animateMotion dur="6s" begin="3.00s" repeatCount="indefinite" path="M175 108 C 175 40, 900 40, 1025 108"/></circle><circle r="3" fill="var(--accent)"><animateMotion dur="6s" begin="4.50s" repeatCount="indefinite" path="M175 108 C 175 40, 900 40, 1025 108"/></circle><text class="p" x="600" y="48" text-anchor="middle" font-size="12">les erreurs de chaque module remontent vers la console</text><rect class="card" x="60" y="380" width="1080" height="44" rx="10"/><text class="tag" x="80" y="407">SOCLE</text><text class="p" x="150" y="407" font-size="12">VPS · Docker Compose · Ansible · supervision · CI/CD — il héberge aussi EduSocialNews et ORION</text></svg>