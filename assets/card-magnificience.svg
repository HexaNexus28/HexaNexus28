<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 560 200" role="img" aria-labelledby="t d"><title id="t">La Magnificience</title><desc id="d">La Magnificience : quiz alignés sur le programme officiel pour les collèges togolais. Pilote, code privé.</desc><style>
:root{--bg:#0b0f14;--card:#0f151c;--line:#1f2b39;--fg:#e6edf3;--muted:#7d8da1;--accent:#3ddc97;--warn:#f2b84b}
@media (prefers-color-scheme: light){:root{--bg:#f6f8fa;--card:#ffffff;--line:#d0d7de;--fg:#0d1117;--muted:#57606a;--accent:#0a8f5b;--warn:#9a6700}}
text{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace}
.bg{fill:var(--bg)}.card{fill:var(--card);stroke:var(--line);stroke-width:1}
.t{fill:var(--fg);font-size:22px;font-weight:700}.p{fill:var(--muted);font-size:13px}
.chip{fill:none;stroke:var(--line)}.chipt{fill:var(--muted);font-size:11px}
.ac{fill:var(--accent)}.as{stroke:var(--accent);fill:none}.tag{fill:var(--accent);font-size:11px;letter-spacing:1px}
.lock{fill:var(--warn);font-size:11px;letter-spacing:1px}
.in{opacity:0;animation:up .8s ease-out .2s forwards}.in2{opacity:0;animation:up .8s ease-out .6s forwards}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in,.in2{opacity:1}}
</style><rect class="bg" width="560" height="200"/><rect class="card" x=".5" y=".5" width="559" height="199" rx="12"/><rect x="0.5" y="0.5" width="4" height="199" rx="2" fill="#f2c230"/><text class="lock in" x="28" y="40" style="fill:#f2c230">// PILOTE · CODE PRIVÉ</text><text class="t in" x="28" y="72">La Magnificience</text><g class="in2"><text class="p" x="28" y="100">Quiz par compétence du programme officiel,</text><text class="p" x="28" y="118">formules, figures, mode hors ligne.</text><rect class="chip" x="28" y="150" width="67" height="22" rx="11"/><text class="chipt" x="38" y="165">React 19</text><rect class="chip" x="102.8" y="150" width="67" height="22" rx="11"/><text class="chipt" x="112.8" y="165">Supabase</text><rect class="chip" x="177.6" y="150" width="47" height="22" rx="11"/><text class="chipt" x="187.6" y="165">KaTeX</text><rect class="chip" x="232.6" y="150" width="93" height="22" rx="11"/><text class="chipt" x="242.6" y="165">multi-tenant</text></g><g class="in2"><clipPath id="cm"><rect x="400" y="40" width="120" height="120" rx="26"/></clipPath><g clip-path="url(#cm)"><image href="data:image/png;base64," x="400" y="40" width="120" height="120" /></g></g></svg>