<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-labelledby="t d"><title id="t">Chiffres clés</title><desc id="d">3 plateformes en ligne, 4 projets open source, 8 fournisseurs IA routés, isolation multi-tenant RLS.</desc><style>
:root{--bg:#0b0f14;--card:#0f151c;--line:#1f2b39;--fg:#e6edf3;--muted:#7d8da1;--accent:#3ddc97;--warn:#f2b84b}
@media (prefers-color-scheme: light){:root{--bg:#f6f8fa;--card:#ffffff;--line:#d0d7de;--fg:#0d1117;--muted:#57606a;--accent:#0a8f5b;--warn:#9a6700}}
text{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace}
.bg{fill:var(--bg)}.card{fill:var(--card);stroke:var(--line);stroke-width:1}
.t{fill:var(--fg);font-size:22px;font-weight:700}.p{fill:var(--muted);font-size:13px}
.chip{fill:none;stroke:var(--line)}.chipt{fill:var(--muted);font-size:11px}
.ac{fill:var(--accent)}.as{stroke:var(--accent);fill:none}.tag{fill:var(--accent);font-size:11px;letter-spacing:1px}
.lock{fill:var(--warn);font-size:11px;letter-spacing:1px}
.in{opacity:0;animation:up .8s ease-out .2s forwards}.in2{opacity:0;animation:up .8s ease-out .6s forwards}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in,.in2{opacity:1}}
</style><rect class="bg" width="1200" height="110"/><g class="in" style="animation-delay:0.2s"><text class="ac" x="20" y="58" font-size="40" font-weight="700" style="font-family:ui-monospace,Consolas,monospace">4</text><text class="p" x="20" y="84">modules, un noyau partagé</text></g><g class="in" style="animation-delay:0.45s"><text class="ac" x="312" y="58" font-size="40" font-weight="700" style="font-family:ui-monospace,Consolas,monospace">4</text><text class="p" x="312" y="84">projets open source</text></g><path d="M288 24 V84" stroke="var(--line)"/><g class="in" style="animation-delay:0.7s"><text class="ac" x="604" y="58" font-size="40" font-weight="700" style="font-family:ui-monospace,Consolas,monospace">8</text><text class="p" x="604" y="84">fournisseurs IA routés</text></g><path d="M580 24 V84" stroke="var(--line)"/><g class="in" style="animation-delay:0.95s"><text class="ac" x="896" y="58" font-size="40" font-weight="700" style="font-family:ui-monospace,Consolas,monospace">RLS</text><text class="p" x="896" y="84">isolation multi-tenant</text></g><path d="M872 24 V84" stroke="var(--line)"/></svg>