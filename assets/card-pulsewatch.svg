<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 560 200" role="img" aria-labelledby="t d"><title id="t">PulseWatch</title><desc id="d">PulseWatch : veille technologique digérée par un agent IA. Logo du projet.</desc><style>
:root{--bg:#0b0f14;--card:#0f151c;--line:#1f2b39;--fg:#e6edf3;--muted:#7d8da1;--accent:#3ddc97;--warn:#f2b84b}
@media (prefers-color-scheme: light){:root{--bg:#f6f8fa;--card:#ffffff;--line:#d0d7de;--fg:#0d1117;--muted:#57606a;--accent:#0a8f5b;--warn:#9a6700}}
text{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace}
.bg{fill:var(--bg)}.card{fill:var(--card);stroke:var(--line);stroke-width:1}
.t{fill:var(--fg);font-size:22px;font-weight:700}.p{fill:var(--muted);font-size:13px}
.chip{fill:none;stroke:var(--line)}.chipt{fill:var(--muted);font-size:11px}
.ac{fill:var(--accent)}.as{stroke:var(--accent);fill:none}.tag{fill:var(--accent);font-size:11px;letter-spacing:1px}
.lock{fill:var(--warn);font-size:11px;letter-spacing:1px}
.in{opacity:0;animation:up .8s ease-out .2s forwards}.in2{opacity:0;animation:up .8s ease-out .6s forwards}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in,.in2{opacity:1}}
</style><rect class="bg" width="560" height="200"/><rect class="card" x=".5" y=".5" width="559" height="199" rx="12"/><rect x="0.5" y="0.5" width="4" height="199" rx="2" fill="#3B82F6"/><text class="tag in" x="28" y="40" style="fill:#3B82F6">// OPEN SOURCE · SAAS</text><text class="t in" x="28" y="72">PulseWatch</text><g class="in2"><text class="p" x="28" y="100">Un agent IA vérifie chaque affirmation</text><text class="p" x="28" y="118">contre ses sources avant le digest.</text><rect class="chip" x="28" y="150" width="93" height="22" rx="11"/><text class="chipt" x="38" y="165">ASP.NET Core</text><rect class="chip" x="129.2" y="150" width="67" height="22" rx="11"/><text class="chipt" x="139.2" y="165">React 19</text><rect class="chip" x="204.0" y="150" width="80" height="22" rx="11"/><text class="chipt" x="214.0" y="165">Google ADK</text></g><g class="in2"><svg x="400" y="40" width="120" height="120" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="64" y1="64" x2="448" y2="448">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0b1220"/>
  <g fill="none" stroke="url(#g)" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="256" cy="256" r="184" stroke-width="26" pathLength="100" stroke-dasharray="78 22" transform="rotate(-210 256 256)"/>
    <path d="M112 272 H196 L234 168 L284 352 L318 272 H400" stroke-width="36"/>
  </g>
  <circle cx="400" cy="272" r="24" fill="#34d399"/>
</svg></g></svg>