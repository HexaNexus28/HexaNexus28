<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 560 200" role="img" aria-labelledby="t d"><title id="t">Nexus Switch</title><desc id="d">Nexus Switch : routeur de modèles IA pour Claude Code. Logo du projet.</desc><style>
:root{--bg:#0b0f14;--card:#0f151c;--line:#1f2b39;--fg:#e6edf3;--muted:#7d8da1;--accent:#3ddc97;--warn:#f2b84b}
@media (prefers-color-scheme: light){:root{--bg:#f6f8fa;--card:#ffffff;--line:#d0d7de;--fg:#0d1117;--muted:#57606a;--accent:#0a8f5b;--warn:#9a6700}}
text{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace}
.bg{fill:var(--bg)}.card{fill:var(--card);stroke:var(--line);stroke-width:1}
.t{fill:var(--fg);font-size:22px;font-weight:700}.p{fill:var(--muted);font-size:13px}
.chip{fill:none;stroke:var(--line)}.chipt{fill:var(--muted);font-size:11px}
.ac{fill:var(--accent)}.as{stroke:var(--accent);fill:none}.tag{fill:var(--accent);font-size:11px;letter-spacing:1px}
.lock{fill:var(--warn);font-size:11px;letter-spacing:1px}
.in{opacity:0;animation:up .8s ease-out .2s forwards}.in2{opacity:0;animation:up .8s ease-out .6s forwards}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in,.in2{opacity:1}}
</style><rect class="bg" width="560" height="200"/><rect class="card" x=".5" y=".5" width="559" height="199" rx="12"/><rect x="0.5" y="0.5" width="4" height="199" rx="2" fill="#22d3ee"/><text class="tag in" x="28" y="40" style="fill:#22d3ee">// OPEN SOURCE · CLI NPM</text><text class="t in" x="28" y="72">Nexus Switch</text><g class="in2"><text class="p" x="28" y="100">Claude Code sur 8 fournisseurs, gratuits</text><text class="p" x="28" y="118">d&#x27;abord, coût réel affiché avant lancement.</text><rect class="chip" x="28" y="150" width="80" height="22" rx="11"/><text class="chipt" x="38" y="165">TypeScript</text><rect class="chip" x="116.0" y="150" width="34" height="22" rx="11"/><text class="chipt" x="126.0" y="165">Ink</text><rect class="chip" x="157.8" y="150" width="60" height="22" rx="11"/><text class="chipt" x="167.8" y="165">Gateway</text><rect class="chip" x="226.0" y="150" width="34" height="22" rx="11"/><text class="chipt" x="236.0" y="165">npm</text></g><g class="in2"><svg x="400" y="40" width="120" height="120" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#0b0f14"/>
  <polygon points="392,120 392,392 120,392" fill="#22d3ee" fill-opacity="0" stroke="#22d3ee" stroke-width="30" stroke-linejoin="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" values="100;0;0;100" keyTimes="0;0.25;0.85;1" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1"/>
    <animate attributeName="fill-opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.4;0.85;1" dur="7s" repeatCount="indefinite"/>
  </polygon>
  <circle r="0" fill="#0b0f14">
    <animate attributeName="r" values="0;0;16;16;0" keyTimes="0;0.4;0.5;0.85;1" dur="7s" repeatCount="indefinite"/>
    <animateMotion dur="7s" repeatCount="indefinite" path="M392 120 L120 392" keyPoints="0;0;1;1" keyTimes="0;0.5;0.8;1" calcMode="linear"/>
  </circle>
</svg></g></svg>