<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Yawo ZOGLO</title>
  <desc id="d">Bannière animée : Yawo ZOGLO, développeur logiciel et IA, architecte de l'invisible. Portrait de l'auteur à droite.</desc>
  <style>
    :root { --bg:#0b0f14; --line:#1b2633; --fg:#e6edf3; --muted:#7d8da1; --accent:#3ddc97; }
    @media (prefers-color-scheme: light) {
      :root { --bg:#f6f8fa; --line:#d0d7de; --fg:#0d1117; --muted:#57606a; --accent:#0a8f5b; }
    }
    .bg { fill:var(--bg); }
    .grid { stroke:var(--line); stroke-width:1; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; }
    .name { font-size:64px; font-weight:700; fill:var(--fg); letter-spacing:-1px;
            font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; }
    .role { font-size:22px; fill:var(--accent); font-family: ui-monospace, Consolas, monospace; }
    .tag  { font-size:16px; fill:var(--muted); font-family: ui-monospace, Consolas, monospace; }
    .scan { stroke:var(--accent); stroke-width:2; opacity:.55; }
    .node { fill:var(--accent); }
    .link { stroke:var(--accent); stroke-width:1.2; fill:none; opacity:.5; stroke-dasharray:260; stroke-dashoffset:260;
            animation: draw 3.2s ease-out forwards, flow 6s linear 3.2s infinite; }
    .l2 { animation-delay:.5s, 3.7s; } .l3 { animation-delay:1s, 4.2s; }
    .reveal { clip-path: inset(0 100% 0 0); animation: type 1.6s steps(14) .3s forwards; }
    .fade { opacity:0; animation: up 1s ease-out 1.5s forwards; }
    .fade2 { opacity:0; animation: up 1s ease-out 2.1s forwards; }
    .cursor { fill:var(--accent); animation: blink 1s steps(2) infinite; }
    .pulse { transform-box:fill-box; transform-origin:center; animation: pulse 2.4s ease-in-out infinite; }
    .p2 { animation-delay:.8s; } .p3 { animation-delay:1.6s; }
    .ring { transform-box:fill-box; transform-origin:center; animation: ring 3.2s ease-out infinite; opacity:0; }
    .r2 { animation-delay:1.6s; }
    .avatar { opacity:0; animation: up 1s ease-out .8s forwards; }
    @keyframes ring { 0% { transform:scale(.88); opacity:.7; } 100% { transform:scale(1.35); opacity:0; } }
    @keyframes draw { to { stroke-dashoffset:0; } }
    @keyframes flow { 0% { stroke-dashoffset:0; } 100% { stroke-dashoffset:-520; } }
    @keyframes type { to { clip-path: inset(0 0 0 0); } }
    @keyframes up { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    @keyframes blink { 50% { opacity:0; } }
    @keyframes pulse { 0%,100% { transform:scale(1); opacity:1; } 50% { transform:scale(1.8); opacity:.35; } }
    @keyframes sweep { from { transform:translateX(-40px); } to { transform:translateX(1240px); } }
    .sweep { animation: sweep 7s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      * { animation:none !important; }
      .link { stroke-dashoffset:0; } .reveal { clip-path:none; } .fade,.fade2,.avatar { opacity:1; } .ring { opacity:0; }
    }
  </style>

  <rect class="bg" width="1200" height="320"/>
  <g class="grid">
    <path d="M0 80H1200M0 160H1200M0 240H1200"/>
    <path d="M200 0V320M400 0V320M600 0V320M800 0V320M1000 0V320"/>
  </g>
  <line class="scan sweep" x1="0" y1="0" x2="0" y2="320"/>

  <!-- réseau : l'invisible qui structure -->
  <path class="link" d="M640 240 C 700 240, 700 120, 760 120 S 840 200, 900 110"/>
  <path class="link l2" d="M640 240 C 720 280, 800 280, 860 240"/>
  <path class="link l3" d="M760 120 C 800 70, 860 60, 900 110"/>
  <circle class="node pulse"    cx="640" cy="240" r="5"/>
  <circle class="node pulse p2" cx="760" cy="120" r="5"/>
  <circle class="node pulse p3" cx="860" cy="240" r="5"/>
  <circle class="node pulse"    cx="900" cy="110" r="5"/>


  <defs><clipPath id="av"><circle cx="1030" cy="160" r="84"/></clipPath></defs>
  <circle class="ring" cx="1030" cy="160" r="96" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <circle class="ring r2" cx="1030" cy="160" r="96" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <image class="avatar" href="data:image/jpeg;base64," x="946" y="76" width="168" height="168" clip-path="url(#av)"/>
  <circle cx="1030" cy="160" r="84" fill="none" stroke="var(--accent)" stroke-width="2"/>

  <g transform="translate(70,0)">
    <text class="tag" x="0" y="92">// hexanexus28</text>
    <text class="name reveal" x="0" y="160">Yawo ZOGLO</text>
    <text class="role fade"  x="0" y="206">Développeur logiciel &amp; IA</text>
    <text class="tag fade2"  x="0" y="246">Architecte de l'invisible · moins mais mieux</text>
    <rect class="cursor" x="378" y="116" width="4" height="48"/>
  </g>
</svg>
