<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 560 200" role="img" aria-labelledby="t d"><title id="t">Profilux</title><desc id="d">Profilux : un profil, deux sorties, CV ATS et portfolio web. Code privé.</desc><style>
:root{--bg:#0b0f14;--card:#0f151c;--line:#1f2b39;--fg:#e6edf3;--muted:#7d8da1;--accent:#3ddc97;--warn:#f2b84b}
@media (prefers-color-scheme: light){:root{--bg:#f6f8fa;--card:#ffffff;--line:#d0d7de;--fg:#0d1117;--muted:#57606a;--accent:#0a8f5b;--warn:#9a6700}}
text{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace}
.bg{fill:var(--bg)}.card{fill:var(--card);stroke:var(--line);stroke-width:1}
.t{fill:var(--fg);font-size:22px;font-weight:700}.p{fill:var(--muted);font-size:13px}
.chip{fill:none;stroke:var(--line)}.chipt{fill:var(--muted);font-size:11px}
.ac{fill:var(--accent)}.as{stroke:var(--accent);fill:none}.tag{fill:var(--accent);font-size:11px;letter-spacing:1px}
.lock{fill:var(--warn);font-size:11px;letter-spacing:1px}
.in{opacity:0;animation:up .8s ease-out .2s forwards}.in2{opacity:0;animation:up .8s ease-out .6s forwards}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in,.in2{opacity:1}}
</style><rect class="bg" width="560" height="200"/><rect class="card" x=".5" y=".5" width="559" height="199" rx="12"/><rect x="0.5" y="0.5" width="4" height="199" rx="2" fill="#2563EB"/><text class="lock in" x="28" y="40" style="fill:#2563EB">// PRODUIT · CODE PRIVÉ</text><text class="t in" x="28" y="72">Profilux</text><g class="in2"><text class="p" x="28" y="100">Un profil, deux sorties : CV ATS et</text><text class="p" x="28" y="118">portfolio web, depuis une seule source.</text><rect class="chip" x="28" y="150" width="80" height="22" rx="11"/><text class="chipt" x="38" y="165">Next.js 14</text><rect class="chip" x="116.0" y="150" width="67" height="22" rx="11"/><text class="chipt" x="126.0" y="165">Supabase</text><rect class="chip" x="190.8" y="150" width="73" height="22" rx="11"/><text class="chipt" x="200.8" y="165">react-pdf</text></g><g class="in2"><svg x="400" y="40" width="120" height="120" viewBox="0 0 100 100">
