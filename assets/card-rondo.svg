<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 560 200" role="img" aria-labelledby="t d"><title id="t">Rondo</title><desc id="d">Rondo : votre musique YouTube, dans un coin de l&#x27;écran. Logo animé du projet.</desc><style>
:root{--bg:#0b0f14;--card:#0f151c;--line:#1f2b39;--fg:#e6edf3;--muted:#7d8da1;--accent:#3ddc97;--warn:#f2b84b}
@media (prefers-color-scheme: light){:root{--bg:#f6f8fa;--card:#ffffff;--line:#d0d7de;--fg:#0d1117;--muted:#57606a;--accent:#0a8f5b;--warn:#9a6700}}
