<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 560 200" role="img" aria-labelledby="t d"><title id="t">EduSocialNews</title><desc id="d">EduSocialNews : plateforme éducative en ligne. Production, code privé.</desc><style>
:root{--bg:#0b0f14;--card:#0f151c;--line:#1f2b39;--fg:#e6edf3;--muted:#7d8da1;--accent:#3ddc97;--warn:#f2b84b}
@media (prefers-color-scheme: light){:root{--bg:#f6f8fa;--card:#ffffff;--line:#d0d7de;--fg:#0d1117;--muted:#57606a;--accent:#0a8f5b;--warn:#9a6700}}
text{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace}
.bg{fill:var(--bg)}.card{fill:var(--card);stroke:var(--line);stroke-width:1}
.t{fill:var(--fg);font-size:22px;font-weight:700}.p{fill:var(--muted);font-size:13px}
.chip{fill:none;stroke:var(--line)}.chipt{fill:var(--muted);font-size:11px}
.ac{fill:var(--accent)}.as{stroke:var(--accent);fill:none}.tag{fill:var(--accent);font-size:11px;letter-spacing:1px}
.lock{fill:var(--warn);font-size:11px;letter-spacing:1px}
.in{opacity:0;animation:up .8s ease-out .2s forwards}.in2{opacity:0;animation:up .8s ease-out .6s forwards}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in,.in2{opacity:1}}
</style><rect class="bg" width="560" height="200"/><rect class="card" x=".5" y=".5" width="559" height="199" rx="12"/><rect x="0.5" y="0.5" width="4" height="199" rx="2" fill="#1d6b8a"/><text class="lock in" x="28" y="40" style="fill:#1d6b8a">// PRODUCTION · CODE PRIVÉ</text><text class="t in" x="28" y="72">EduSocialNews</text><g class="in2"><text class="p" x="28" y="100">Articles, livres, podcasts et quiz,</text><text class="p" x="28" y="118">migré en 2026 sur un VPS Docker.</text><rect class="chip" x="28" y="150" width="73" height="22" rx="11"/><text class="chipt" x="38" y="165">Laravel 9</text><rect class="chip" x="109.4" y="150" width="60" height="22" rx="11"/><text class="chipt" x="119.4" y="165">MariaDB</text><rect class="chip" x="177.6" y="150" width="54" height="22" rx="11"/><text class="chipt" x="187.6" y="165">Docker</text><rect class="chip" x="239.2" y="150" width="60" height="22" rx="11"/><text class="chipt" x="249.2" y="165">Ansible</text></g><g class="in2"><clipPath id="ce"><circle cx="460" cy="100" r="58"/></clipPath><image href="data:image/jpeg;base64," x="402" y="42" width="116" height="116" clip-path="url(#ce)"/></g></svg>