<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="t d">
<title id="t">Yawo Zoglo</title>
<desc id="d">Yawo Zoglo, développeur logiciel et IA. Plateformes multi-tenant, agents IA, infrastructure.</desc>
<style>
.kick{font:600 13px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:2.6px;fill:#0a8f5b}
.name{font:500 50px "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;letter-spacing:-.4px;fill:#1f2328}
.sub{font:400 19px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#59636e}
.rule{stroke:#0a8f5b;stroke-width:2;stroke-linecap:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .7s ease-out .1s forwards}
.hair{stroke:#d0d7de;stroke-width:1;stroke-dasharray:1190;stroke-dashoffset:1190;animation:draw 1.6s cubic-bezier(.4,0,.2,1) .9s forwards}
.f{opacity:0;animation:up .7s ease-out forwards}
.a{animation-delay:.3s}.b{animation-delay:.5s}.c{animation-delay:.75s}.p{animation-delay:.95s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.rule,.hair{stroke-dashoffset:0}.f{opacity:1}}
</style>
